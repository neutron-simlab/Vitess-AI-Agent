name: CI

on:
  push:
    branches:
      - development
      - main
  pull_request:
    branches:
      - development
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only
    steps:
      - name: Check out Vitess AI Agent
        uses: actions/checkout@v4
        with:
          path: Vitess-AI-Agent
          submodules: recursive

      - name: Read the compatible juena-core revision
        id: core
        working-directory: Vitess-AI-Agent
        shell: bash
        run: echo "ref=$(cat .juena-core-revision)" >> "$GITHUB_OUTPUT"

      - name: Check out juena-core
        uses: actions/checkout@v4
        with:
          repository: neutron-simlab/juena-core
          ref: ${{ steps.core.outputs.ref }}
          path: juena-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"
          enable-cache: true

      - name: Install the frozen application environment
        working-directory: Vitess-AI-Agent
        run: uv sync --frozen

      - name: Check imports and run the application suite
        working-directory: Vitess-AI-Agent
        run: ./vitess test

      - name: Validate the Compose model
        working-directory: Vitess-AI-Agent
        run: docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the shared application and MCP image
        working-directory: Vitess-AI-Agent
        run: docker compose build vitess-mcp
