[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = src .venv venv node_modules .git
addopts = 
    --verbose
    --strict-markers
    --ignore=src
    --ignore-glob=**/src/**
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    asyncio: Async tests (requires pytest-asyncio)

