[project]
name = "vitess-ai"
authors = [
    {name = "Ahmad Z. Ihsan",email = "a.ihsan@fz-juelich.de"}
]
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13, <4.0"
dependencies = [
    "langchain[openai]>=1.0.0",
    "langchain-community>=1.0.0",
    "langchain-openai>=1.0.0",
    "langgraph>=1.0.0",
    "langgraph-cli[inmem]>=1.0.0",
    "langgraph-api>=1.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "httpx>=0.25.0",
    "streamlit>=1.28.0",
    "pydantic[all]>=2.11.2,<3.0.0",
    "fastmcp>=2.9.2",
    "langchain-mcp-adapters>=0.1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "langgraph-cli[inmem]>=0.0.1",
    "langgraph-api>=0.0.1",
    "fastapi>=0.104.0",
    "httpx>=0.25.0",
]
