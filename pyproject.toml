[project]
name = "vitess-ai"
authors = [
    {name = "Ahmad Z. Ihsan",email = "a.ihsan@fz-juelich.de"}
]
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13, <4.0"
dependencies = [
    "langchain[openai]>=1.0.0",
    "langchain-openai>=1.0.0",
    "langgraph>=1.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "httpx>=0.25.0",
    "streamlit>=1.28.0",
    "pydantic[all]>=2.11.2,<3.0.0",
    "fastmcp>=2.9.2",
    "langchain-mcp-adapters>=0.1.7",
    "langchain-community>=0.4.1",
    "langgraph-api>=0.4.48",
]

[project.optional-dependencies]
inmem = [
    "langgraph-cli>=0.4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "langgraph-cli[inmem]>=0.0.1",
    "langgraph-api>=0.0.1",
    "fastapi>=0.104.0",
    "httpx>=0.25.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-mock>=3.15.1",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    "responses>=0.24.0",
]
