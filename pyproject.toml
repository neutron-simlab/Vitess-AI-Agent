[project]
name = "vitess-ai"
version = "0.1.0"
description = "A local VITESS simulation assistant built on juena-core"
readme = "README.md"
requires-python = ">=3.11, <4.0"
dependencies = [
    "juena-core[ui,mcp]",
    "fastmcp>=4,<5",
    # Imported directly: the application probes the MCP server's health route
    # before it builds an agent against it (src/vitess_ai/mcp/connection.py).
    "httpx>=0.28,<1",
    "matplotlib",
    "numpy",
    "plotly",
    "pydantic>=2,<3",
    # Imported directly for FastMCP's custom health response.
    "starlette>=1,<2",
    "vitess-rag",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
]

[tool.uv.sources]
juena-core = { path = "../juena-core" }
vitess-rag = { path = "rag/vitess-rag" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repository root, so `tests/` can import `app.*`. The Streamlit pages are
# not part of the installed package -- `streamlit run` takes a path, not a
# module -- but their invariants are worth asserting, and `tests/` is already on
# the path through pytest's rootdir insertion.
pythonpath = ["."]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
