[project]
name = "vitess-ai"
version = "0.1.0"
description = "A local VITESS simulation assistant built on juena-core"
readme = "README.md"
requires-python = ">=3.11, <4.0"
dependencies = [
    "juena-core[ui,mcp]",
    "fastmcp>=4,<5",
    "matplotlib",
    "numpy",
    "plotly",
    "vitess-rag",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
]

[tool.uv.sources]
juena-core = { path = "../juena-core" }
vitess-rag = { path = "rag/vitess-rag" }

[tool.pytest.ini_options]
testpaths = ["tests"]

