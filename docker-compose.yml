# =============================================================================
# DOCKER COMPOSE CONFIGURATION
# =============================================================================
# Single configuration file for both development and production.
#
# Environment Variables:
#   - Development: Uses .env file in project root (auto-loaded by docker-compose)
#   - Production: Uses /etc/vitess-ai/.env (set via env_file, created by CI/CD)
#
# Usage:
#   docker-compose up -d
#
# Security:
#   - Never commit .env files with actual secrets
#   - Production secrets in /etc/vitess-ai/.env (600 permissions)
#   - Use GitHub Secrets for CI/CD pipeline
# =============================================================================
services:
  vitess:
    build:
      context: ./vitess
      dockerfile: Dockerfile
    image: vitess:latest
    container_name: vitess-builder
    volumes:
      - vitess-modules:/vitess/MODULES:ro
      - vitess-projects:/data/projects
    environment:
      - V=/vitess/MODULES
      - P=/data/projects
      - L=/data/logs/logfile.log
    # Keep container running to provide volume access
    command: tail -f /dev/null
    networks:
      - vitess-network

  vitess-ai-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: vitess-ai-agent:latest
    container_name: vitess-ai-agent
    depends_on:
      - vitess
    volumes:
      - vitess-modules:/vitess/MODULES:ro
      - vitess-projects:/data/projects
    environment:
      # Vitess paths (automatically set by Docker, no need to configure in .env)
      - VITESS_MODULES_PATH=/vitess/MODULES
      - VITESS_PROJECT_PATH=/data/projects
      - VITESS_LOG_PATH=/data/logs/logfile.log
      # Application configuration (loaded from .env in dev, /etc/vitess-ai/.env in prod)
      - DEFAULT_PROVIDER=${DEFAULT_PROVIDER:-openai}
      - FALLBACK_PROVIDER=${FALLBACK_PROVIDER:-blablador}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-gpt-4o-mini-2024-07-18}
      - MAX_TOKENS=${MAX_TOKENS:-4000}
      - TIMEOUT_SECONDS=${TIMEOUT_SECONDS:-60}
      - MAX_RETRIES=${MAX_RETRIES:-3}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - BLABLADOR_API_KEY=${BLABLADOR_API_KEY:-}
      - BLABLADOR_BASE_URL=${BLABLADOR_BASE_URL:-https://api.helmholtz-blablador.fz-juelich.de/v1/}
      - BLABLADOR_DEFAULT_MODEL=${BLABLADOR_DEFAULT_MODEL:-alias-fast-code}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - LANGSMITH_ENDPOINT=${LANGSMITH_ENDPOINT:-https://eu.api.smith.langchain.com}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-Vitess-AI-Agent}
      - READIN_MCP_PATH=${READIN_MCP_PATH:-./src/vitess_ai/mcp/readin_module_tools.py}
      - GUIDE_MCP_PATH=${GUIDE_MCP_PATH:-./src/vitess_ai/mcp/guide_module_tools.py}
      - WRITEOUT_MCP_PATH=${WRITEOUT_MCP_PATH:-./src/vitess_ai/mcp/writeout_module_tools.py}
      - MONITOR_MCP_PATH=${MONITOR_MCP_PATH:-./src/vitess_ai/mcp/monitor_module_tools.py}
      - FILTER_MCP_PATH=${FILTER_MCP_PATH:-./src/vitess_ai/mcp/filter_module_tools.py}
      - SUPERVISOR_MCP_PATH=${SUPERVISOR_MCP_PATH:-./src/vitess_ai/mcp/supervisor_tools.py}
      - MCP_TRANSPORT_MODE=${MCP_TRANSPORT_MODE:-http}
      - MCP_HOST=${MCP_HOST:-0.0.0.0}
      - MCP_READIN_PORT=${MCP_READIN_PORT:-9001}
      - MCP_GUIDE_PORT=${MCP_GUIDE_PORT:-9002}
      - MCP_WRITEOUT_PORT=${MCP_WRITEOUT_PORT:-9003}
      - MCP_MONITOR_PORT=${MCP_MONITOR_PORT:-9004}
      - MCP_SUPERVISOR_PORT=${MCP_SUPERVISOR_PORT:-9005}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - RELOAD=${RELOAD:-false}
    ports:
      - "8000:8000"
      - "8501:8501"
      - "9001:9001"
      - "9002:9002"
      - "9003:9003"
      - "9004:9004"
      - "9005:9005"
    networks:
      - vitess-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  vitess-modules:
    driver: local
  vitess-projects:
    driver: local

networks:
  vitess-network:
    driver: bridge

